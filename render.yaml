# Render blueprint for the Conan API (TRD §15). Secrets are set in the Render dashboard (sync: false).
services:
  - type: web
    name: conan-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: GEMINI_RPM
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: BATCH_CHARS
        value: "8000"
      - key: PIPELINE_VERSION
        value: v1
      - key: PROMPT_VERSION
        value: p1
      - key: LLM_MODE
        value: live
